name: Build and push gods-eye-view image

on:
  push:
    branches:
      - main
    paths:
      - 'gods-eye-view/**'
      - '.github/workflows/build-gods-eye-view-image.yml'
  schedule:
    # Runs every day at 00:00 UTC to pick up upstream changes
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve upstream commit
        run: |
          GEV_SHA=$(git ls-remote https://github.com/bilawalsidhu/gods-eye-view.git refs/heads/main | cut -f1)
          echo "GEV_SHA=$GEV_SHA" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gods-eye-view image
        uses: docker/build-push-action@v6
        with:
          context: ./gods-eye-view
          file: ./gods-eye-view/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GEV_REF=${{ env.GEV_SHA }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gods-eye-view:latest
            ghcr.io/${{ github.repository_owner }}/gods-eye-view:${{ env.GEV_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

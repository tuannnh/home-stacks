name: camera-dashboard
services:

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: go2rtc
    restart: unless-stopped
    # host networking makes WebRTC candidate discovery + RTSP just work on a LAN.
    network_mode: host
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    env_file:
      - stack.env
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
      - ./go2rtc-entrypoint.sh:/entrypoint.sh:ro

  dashboard:
    # Prebuilt image from GitHub Actions (GHCR). `build: .` lets you also build
    # locally with `docker compose up --build` without pulling.
    image: ghcr.io/tuannnh/camera-dashboard:latest
    container_name: camera-dashboard
    restart: unless-stopped
    env_file:
      - stack.env
    ports:
      - "11160:80"
    depends_on:
      - go2rtc
    network_mode: bridge
